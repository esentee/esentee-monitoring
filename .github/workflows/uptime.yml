name: Kontrola dostupnosti webů

on:
  schedule:
    # Každých 5 minut, ale posunuto mimo celé pětiminutovky. Na kulatých časech
    # startují plány celého GitHubu naráz a běhy se tam nejvíc zdržují nebo
    # zahazují. Reálná granularita je i tak 5–20 minut.
    #
    # POZOR: tenhle interval je zdarma jen díky tomu, že je repozitář veřejný.
    # Kdyby se přepnul na privátní, 2 000 minut free kvóty padne za týden.
    - cron: "3,8,13,18,23,28,33,38,43,48,53,58 * * * *"
  workflow_dispatch:

# Běh navíc nestartuje, když předchozí ještě běží.
concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  kontrola:
    name: Deset domén na multihostingu multi_600090
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Změřit domény
        run: bash kontrola.sh
