name: Kontrola dostupnosti webů

on:
  # POZOR: plán je zatím vypnutý, dokud je repozitář privátní. Kontrola každých
  # 5 minut znamená ~8 640 běhů měsíčně a privátní repozitář má na free tarifu
  # jen 2 000 minut. Po přepnutí na veřejný se řádek s cronem odkomentuje.
  # schedule:
  #   # Každých 5 minut. GitHub se u naplánovaných běhů umí zdržet,
  #   # reálná granularita je 5–20 minut.
  #   - cron: "*/5 * * * *"
  workflow_dispatch:

# Běh navíc nestartuje, když předchozí ještě běží.
concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  kontrola:
    name: Deset domén na multihostingu multi_600090
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Změřit domény
        run: bash kontrola.sh
